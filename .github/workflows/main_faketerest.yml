# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - faketerest

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4


      # PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'


      # Composer
      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'


      - name: Install Composer dependencies
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader


      # Node / Vite
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Install frontend dependencies
        run: npm install


      - name: Build Vite assets
        run: npm run build


      # Prepare Laravel folders
      - name: Prepare Laravel folders
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache


      # Upload
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .


  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read


    steps:

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app


      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45D826FA751246ACBAED7AA13E4D2213 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_53C034F05BAF49B8BD6EEEF1318AEE9F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_72D13F7CC38F4B7BBC5B0DA172FE4EBA }}


      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'faketerest'
          slot-name: 'Production'
          package: .
